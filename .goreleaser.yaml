version: 2

project_name: avd-shortpath-test

builds:
  - id: avd-shortpath-test
    main: ./cmd/avd-shortpath-test
    binary: avd-shortpath-test
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

universal_binaries:
  - id: avd-shortpath-test
    replace: true

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: |
    This is an unofficial tool and is not affiliated with or endorsed by Microsoft.
